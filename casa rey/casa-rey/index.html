$('inv').innerHTML=S.it.length?'<p>Herramientas: '+S.it.map(function(x){return'<span class="chip">'+x+'</span>'}).join('')+'</p>':''}
setInterval(function(){if(!S.run)return;S.t--;hud();if(S.t<=0)lose()},1000);
$('go').onclick=function(){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}good();$('intro').classList.add('hide');$('cover').classList.add('hide');$('game').classList.remove('hide');S.run=true;scrollTo(0,0);type('ec','Empieza la cuenta regresiva.',show)};

function show(){var r=R[S.r],p=r.P[S.p];S.lk=false;hud();
$('pz').innerHTML='<h2>'+r.n+' · acertijo '+(S.p+1)+'/'+r.P.length+'</h2><p>'+p.s+'</p><div id="bd"></div><div id="fb"></div><p><button class="mg" id="hn">PISTA (−1 min)</button></p>';
$('bd').onclick=null;K[p.k](p);
$('hn').onclick=function(){if(S.lk)return;S.t-=60;hud();snd(300,.1);$('fb').innerHTML='<div class="fb no">Pista: '+p.h+'</div>'}}
function win(p){if(S.lk)return;S.lk=true;S.sc+=100;if(p.rw&&S.it.indexOf(p.rw)<0)S.it.push(p.rw);good();flash('ok');hud();
$('bd').style.pointerEvents='none';$('hn').classList.add('hide');
$('fb').innerHTML='<div class="fb ok">CORRECTO. '+p.l+'</div><p><button id="nx">SEGUIR</button></p>';
type('ec',p.ec);$('nx').onclick=next}
function fail(m){if(S.lk)return;S.t-=20;hud();bad();flash('no');$('fb').innerHTML='<div class="fb no">'+(m||'Incorrecto. Eco te quitó 20 segundos.')+'</div>'}
function next(){var r=R[S.r];S.p++;if(S.p>=r.P.length){S.r++;S.p=0;if(S.r>=R.length){fin();return}
$('pz').innerHTML='<h2>Puerta abierta</h2><p>Salís de la habitación. Eco se ríe por el parlante.</p><p><button id="nr">ENTRAR A LA SIGUIENTE HABITACIÓN</button></p>';$('nr').onclick=show;good();return}show()}
function fin(){S.run=false;good();$('pz').innerHTML='<h2>Fin de la parte 1</h2><div class="time" style="color:#39ff88">'+S.sc+' puntos</div><p>Te quedaron '+fmtT(Math.max(0,S.t))+' minutos. Superaste el living y la cocina, pero Eco sigue adentro.</p><p>Faltan 6 habitaciones: cuarto de los chicos, oficina, garaje, sótano, terraza y el enfrentamiento final.</p>';type('ec','Esto no terminó, Lía. Ven a buscarme.')}
function lose(){S.run=false;bad();flash('no');$('pz').innerHTML='<h2>Se acabó el tiempo</h2><p>Eco borró todo y la casa quedó a oscuras. Aprendiste mucho: probá de nuevo.</p><p><button id="rt">REINTENTAR</button></p>';$('rt').onclick=function(){S={r:0,p:0,t:3600,it:[],sc:0,run:true,lk:false};show()};type('ec','Gané yo.')}

function fin(){S.run=false;good();var g=(S.d||[]).filter(Boolean).length,e=g===2?'FINAL: HACKER ÉTICA. Eco queda detenido y la familia a salvo.':g===1?'FINAL GRIS. Eco escapa, pero perdió su acceso a la casa.':'FINAL OSCURO. Eco se va libre y la casa queda comprometida.';
$('pz').innerHTML='<h2>Escapaste de Casa Rey</h2><div class="time" style="color:#39ff88">'+S.sc+' puntos</div><p>Te sobraron '+fmtT(Math.max(0,S.t))+' minutos.</p><div class="fb ok">'+e+'</div><p>Aprendiste sobre routers, aparatos conectados, cámaras, phishing, cerraduras, registros y VPN.</p><p><button id="rp">JUGAR DE NUEVO</button></p>';
$('rp').onclick=function(){S={r:0,p:0,t:3600,it:[],sc:0,run:true,lk:false,d:[]};show()};type('ec',g===2?'Me ganaste, Lía. Esta vez.':'Nos vemos pronto.')}
var K={
dc:function(p){$('bd').innerHTML='<p>'+p.q+'</p>'+p.o.map(function(o,j){return'<button class="op" data-o="'+j+'">'+o[0]+'</button>'}).join('');
$('bd').onclick=function(e){var b=e.target.closest('.op');if(!b)return;var o=p.o[+b.dataset.o];(S.d=S.d||[]).push(o[2]);p.ec=o[1];win(p)}},
ch:function(p){$('bd').innerHTML='<p>'+p.q+'</p>'+p.o.map(function(o,j){return'<button class="op" data-o="'+j+'">'+o+'</button>'}).join('');
$('bd').onclick=function(e){var b=e.target.closest('.op');if(!b)return;if(+b.dataset.o===p.c)win(p);else{b.disabled=true;fail()}}},
in:function(p){$('bd').innerHTML='<p>'+p.q+'</p><input type="text" id="an" autocomplete="off" autocapitalize="off" aria-label="Respuesta"><button id="ck">COMPROBAR</button>';
function ck(){p.a.indexOf(nz($('an').value))>-1?win(p):fail()}
$('ck').onclick=ck;$('an').onkeydown=function(e){if(e.key==='Enter')ck()}},
sw:function(p){var st=p.sw.map(function(x){return 1-x[1]});
function r(){$('bd').innerHTML=p.sw.map(function(x,j){return'<button class="op sw" data-j="'+j+'">'+x[0]+': <b>'+(st[j]?'ENCENDIDO':'APAGADO')+'</b></button>'}).join('')+'<p><button id="ap">APLICAR CAMBIOS</button></p>'}
r();$('bd').onclick=function(e){var b=e.target.closest('.sw');if(b){st[+b.dataset.j]^=1;snd(600,.05);r()}else if(e.target.id==='ap'){st.every(function(v,j){return v===p.sw[j][1]})?win(p):fail()}}},
or:function(p){var q=[],s=p.o.map(function(o,j){return j}).sort(function(){return Math.random()-.5});
function r(){$('bd').innerHTML='<p>'+p.q+'</p><div class="msg">'+(q.length?q.map(function(j){return p.o[j]}).join(' → '):'…')+'</div>'+s.filter(function(j){return q.indexOf(j)<0}).map(function(j){return'<button class="op" data-o="'+j+'">'+p.o[j]+'</button>'}).join('')}
r();$('bd').onclick=function(e){var b=e.target.closest('.op');if(!b)return;var j=+b.dataset.o;if(j===q.length){q.push(j);snd(700,.06);r();if(q.length===p.o.length)win(p)}else{q=[];r();fail('Orden incorrecto. Empezá de nuevo (−20 s).')}}},
tm:function(p){$('bd').innerHTML='<div class="msg" id="out">Escribí help y apretá Enter.</div><input type="text" id="cmd" placeholder="> comando" autocomplete="off" autocapitalize="off" aria-label="Comando">';
$('cmd').onkeydown=function(e){if(e.key!=='Enter'||S.lk)return;var c=this.value.trim(),o='> '+c+'\n',a=c.split(' ');this.value='';
if(a[0]==='help')o+='ls, cat <archivo>, whoami';else if(a[0]==='ls')o+=Object.keys(p.F).join('   ');else if(a[0]==='whoami')o+='lia';
else if(a[0]==='cat'&&p.F[a[1]]){o+=p.F[a[1]];if(a[1]===p.tg){$('out').textContent=o;win(p);return}}else o+='comando no encontrado';$('out').textContent=o;snd(900,.04)}}
};
})();
</script>
